[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "session_py"
version = "0.163.0"
description = "A minimal Python geometry library"
authors = [{name = "Petras Vestartas", email = "petrasvestartas@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=1.20.0",
    "protobuf>=6.33,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
performance = ["numba>=0.56.0"]

[dependency-groups]
dev = [
    "ruff",
    "pre-commit",
    "build",
    { include-group = "proto" },
    { include-group = "tests" },
    { include-group = "docs" },
]
# protoc, for regenerating src/session_py/proto/*_pb2.py. A build-time tool, not
# something the package imports at runtime — it used to sit in [project]
# dependencies, which made every install of session_py demand it. grpcio-tools
# ships no pure-Python wheel, so that made the package uninstallable under
# Pyodide/micropip and blocked running session_py in the browser at all.
# Included in `dev`, so `uv sync` still provides it for anyone regenerating.
# exact pin: CI diffs regenerated *_pb2.py against committed files, and the
# version banner protoc stamps into them follows this package's version
proto = ["grpcio-tools==1.80.0"]
tests = []
docs = [
    "sphinx",
    "sphinx-compas-theme",
]

[project.urls]
Homepage = "https://github.com/petrasvestartas/session_py"
Repository = "https://github.com/petrasvestartas/session_py"

[tool.hatch.build.targets.wheel]

[tool.hatch.build]
src-layout = true

[tool.pytest.ini_options]
testpaths = ["src"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]
